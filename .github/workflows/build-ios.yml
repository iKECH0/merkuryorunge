name: iOS Quality Gate and TestFlight

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Archive, sign, and upload this build to TestFlight'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_BUNDLE_ID: com.merkuryorunge.app
  APPLE_TEAM_ID: 6U6XFCSGNV
  XCODE_PROJECT: frontend/ios/App/App.xcodeproj
  XCODE_SCHEME: App

jobs:
  verify:
    name: Build for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Scan Frontend Source
        working-directory: frontend
        run: npm run lint

      - name: Block Critical Runtime Vulnerabilities
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Build Web App
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor iOS Project
        working-directory: frontend
        run: npx cap sync ios

      - name: Verify iOS Configuration
        shell: bash
        run: |
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.merkuryorunge.app;' "$XCODE_PROJECT/project.pbxproj"
          grep -q 'DEVELOPMENT_TEAM = 6U6XFCSGNV;' "$XCODE_PROJECT/project.pbxproj"
          test -s frontend/ios/App/App/public/index.html

      - name: Build Native App Without Signing
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight
    needs: verify
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies and Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Validate Apple Secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64"

      - name: Install Apple Signing Material
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/merkuryorunge-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"

          echo "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          mkdir -p "$API_KEY_DIR"
          echo "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 --decode > "$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');

          const base64url = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = base64url({ alg: 'ES256', kid: process.env.APP_STORE_CONNECT_API_KEY_ID, typ: 'JWT' });
          const payload = base64url({
            iss: process.env.APP_STORE_CONNECT_API_ISSUER_ID,
            iat: now,
            exp: now + 1200,
            aud: 'appstoreconnect-v1',
          });
          const signingInput = `${header}.${payload}`;
          const privateKey = fs.readFileSync(
            `${process.env.HOME}/.appstoreconnect/private_keys/AuthKey_${process.env.APP_STORE_CONNECT_API_KEY_ID}.p8`,
          );
          const signature = crypto.sign('sha256', Buffer.from(signingInput), {
            key: privateKey,
            dsaEncoding: 'ieee-p1363',
          }).toString('base64url');
          const token = `${signingInput}.${signature}`;

          fetch('https://api.appstoreconnect.apple.com/v1/profiles/PB9H22LD3B', {
            headers: { Authorization: `Bearer ${token}` },
          }).then(async response => {
            if (!response.ok) throw new Error(`Provisioning profile download failed: ${response.status} ${await response.text()}`);
            const body = await response.json();
            fs.writeFileSync(
              `${process.env.HOME}/Library/MobileDevice/Provisioning Profiles/MerkurYorunge.mobileprovision`,
              Buffer.from(body.data.attributes.profileContent, 'base64'),
            );
          }).catch(error => { console.error(error); process.exit(1); });
          NODE

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Archive Signed App
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MerkurYorunge.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Merkur Yorunge App Store" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export App Store IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.merkuryorunge.app</key>
              <string>Merkur Yorunge App Store</string>
            </dict>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/MerkurYorunge.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: merkuryorunge-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
